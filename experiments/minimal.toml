schema_version = 1
initial_state = [0.1, 0.15]

[model.excitatory]
timescale = 2.0
slope = 2.0
threshold = 0.1

[model.inhibitory]
timescale = 1.5
slope = 1.5
threshold = 0.2
failure_threshold = 1.1

[model.coupling]
e_to_e = 1.2
i_to_e = 0.6
e_to_i = 0.7
i_to_i = 0.4

[drive]
interpretation = "AfferentExcitation"
baseline = [0.0, 0.0]

[[drive.pulses]]
onset = 2.0
offset = 5.0
increment = [0.20, 0.10]

[[drive.pulses]]
onset = 4.0
offset = 7.0
increment = [0.05, 0.0]

[equilibrium]
solver_abstol = 1e-12
solver_reltol = 1e-10
residual_atol = 1e-9
domain_atol = 1e-8
dedup_atol = 1e-7
singular_atol = 1e-10
singular_rtol = 1e-8
maxiters = 100

[stability]
spectral_atol = 1e-10
spectral_rtol = 1e-8

[diagnostics]
window_duration = 5.0
coordinate_atol = 1e-6
balance_atol = 1e-8
min_samples = 3

[[variants]]
name = "default"
time_span = [0.0, 20.0]
saveat = 0.1
abstol = 1e-10
reltol = 1e-10
domain_atol = 1e-8
maxiters = 100000

[[variants]]
name = "refined"
time_span = [0.0, 20.0]
saveat = 0.05
abstol = 1e-12
reltol = 1e-12
domain_atol = 1e-8
maxiters = 100000

[[variants]]
name = "extended"
time_span = [0.0, 40.0]
saveat = 0.1
abstol = 1e-10
reltol = 1e-10
domain_atol = 1e-8
maxiters = 100000
