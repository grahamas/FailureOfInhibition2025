schema_version = 2
description = "Claim-specific Figure 3 FoI rescue replay; coordinate-selected states and finite protocol brackets only"

[model.excitatory]
timescale = 7.8
slope = 5.0
threshold = 1.5

[model.inhibitory]
timescale = 34.32
slope = 5.0
threshold = 4.0
failure_threshold = 8.0

[model.coupling]
e_to_e = 17.0
i_to_e = 9.0
e_to_i = 19.0
i_to_i = 4.0

[search]
grid_points = 21

[equilibrium]
solver_abstol = 1e-12
solver_reltol = 1e-10
residual_atol = 1e-9
domain_atol = 1e-8
dedup_atol = 1e-7
singular_atol = 1e-10
singular_rtol = 1e-8
maxiters = 100

[stability]
spectral_atol = 1e-10
spectral_rtol = 1e-8

[diagnostics]
window_duration = 100.0
coordinate_atol = 1e-6
balance_atol = 1e-8
min_samples = 21

[pulses]
amplitudes = { start = 0.0, stop = 8.0, step = 0.25 }
durations = [10.0, 15.0, 20.0]
targets = ["negative_E"]
followup_times = [5000.0, 10000.0, 20000.0]
refinement_levels = 2
duration_refinement_levels = 0
retain_trajectories = false
trajectory_saveat = 1.0
abstol = 1e-10
reltol = 1e-10
domain_atol = 1e-8
maxiters = 1000000

[rescue]
condition = "failure_of_inhibition"
target = "negative_E"
source_state = [0.49999999999999983, 0.000558673968635021]
destination_state = [0.0005803789416721499, 2.1779885914863984e-9]
coordinate_atol = 1e-6
cap_recheck_duration = 10.0
recheck_followup_time = 20000.0
recheck_abstol = 1e-11
recheck_reltol = 1e-11
